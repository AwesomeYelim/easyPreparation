name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: go vet
        run: go vet -tags dev ./cmd/server/

      - name: go build check
        run: go build -tags dev -o /dev/null ./cmd/server/

      - name: go smoke tests (with race detector)
        run: go test -race -tags dev ./internal/handlers/ -run TestSmoke -v

  # 신규 설치 기동 테스트 — 사용자가 처음 설치했을 때와 동일한 경로를 그대로 탄다:
  # prod 빌드(embed 포함) → 빈 디렉터리에서 기동 → embed 추출 → schema 적용 → /api/health 200 → graceful 종료.
  # integration 잡은 -tags dev(embed 없음) + 미리 만든 ci_data 로 돌기 때문에 이 경로를 검증하지 못한다.
  fresh-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: embed 데이터 준비 (release.yml 과 동일)
        run: |
          cp data/bible.db internal/embedded/data/bible.db
          cp data/schema.sql internal/embedded/data/schema.sql

      - name: prod 빌드 (embed 포함, frontend 는 .gitkeep 만)
        run: go build -o server_prod ./cmd/server/

      - name: 빈 디렉터리에서 기동
        run: |
          FRESH="$RUNNER_TEMP/fresh"
          mkdir -p "$FRESH"
          cp server_prod "$FRESH/server_prod"
          cd "$FRESH"
          EASYPREP_DATA_DIR="$FRESH/data" ./server_prod > server.log 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          echo "FRESH=$FRESH" >> "$GITHUB_ENV"

      - name: /api/health 200 대기 (신규 설치는 503 불허)
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o "$FRESH/health.json" -w "%{http_code}" http://localhost:8080/api/health 2>/dev/null || echo "000")
            if [[ "$STATUS" == "200" ]]; then
              echo "health HTTP 200"; cat "$FRESH/health.json"; echo
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS"; sleep 2
          done
          echo "::error::서버가 30회 시도 내에 200을 반환하지 않음 (마지막 HTTP $STATUS)"
          cat "$FRESH/server.log"
          exit 1

      - name: 신규 설치 상태 검증
        run: |
          LOG="$FRESH/server.log"
          fail=0
          check() { if grep -qF -- "$1" "$LOG"; then echo "ok   $1"; else echo "::error::로그에 없음: $1"; fail=1; fi; }
          absent() { if grep -qF -- "$1" "$LOG"; then echo "::error::로그에 있어선 안 됨: $1"; fail=1; else echo "ok   (없음) $1"; fi; }
          # 서버 자체 헬스체크(WaitForServer → RunHealthCheck)는 비동기 goroutine 이라 curl 성공 직후엔
          # 아직 로그가 없을 수 있음 → 최대 15초 대기 후 단언
          for i in $(seq 1 30); do grep -qF "[health] 헬스체크 결과" "$LOG" && break; sleep 0.5; done
          check "[embed] 추출 완료: schema.sql"
          check "[embed] 추출 완료: main_worship.json"
          check "[DB] 스키마 자동 초기화 완료"
          check "프론트엔드 정적 파일 서빙 활성화 (embedded)"
          check "[health] 헬스체크 결과"
          absent "schema.sql 없음"
          absent "읽기 실패 (스킵)"
          test -f "$FRESH/data/config/main_worship.json" && echo "ok   config/main_worship.json 추출됨" || { echo "::error::config/main_worship.json 없음"; fail=1; }
          python3 - "$FRESH/data/data/easyprep.db" <<'PY' || fail=1
          import sqlite3, sys
          need = {"churches", "licenses", "custom_songs"}
          have = {r[0] for r in sqlite3.connect(sys.argv[1]).execute("select name from sqlite_master where type='table'")}
          missing = need - have
          print("tables:", sorted(have))
          if missing:
              print(f"::error::테이블 누락: {sorted(missing)}"); sys.exit(1)
          print("ok   churches/licenses/custom_songs 테이블 존재")
          PY
          exit $fail

      - name: graceful 종료 (SIGINT)
        run: |
          kill -INT "$SERVER_PID"
          for i in $(seq 1 20); do
            kill -0 "$SERVER_PID" 2>/dev/null || break
            sleep 0.5
          done
          if kill -0 "$SERVER_PID" 2>/dev/null; then
            echo "::error::SIGINT 후 10초 내 종료되지 않음"; kill -9 "$SERVER_PID"; exit 1
          fi
          grep -qF "서버 종료 완료" "$FRESH/server.log" && echo "ok   graceful 종료 로그" || { echo "::error::'서버 종료 완료' 로그 없음"; exit 1; }

      - name: 서버 로그 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-install-server-log
          path: ${{ env.FRESH }}/server.log

      - name: 서버 정리
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true

  integration:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: 서버 빌드
        run: go build -tags dev -o server_test${{ matrix.os == 'windows-latest' && '.exe' || '' }} ./cmd/server/

      - name: 테스트 데이터 디렉토리 생성
        shell: bash
        run: |
          mkdir -p "$(pwd)/ci_data/config" "$(pwd)/ci_data/data"
          echo '[]' > "$(pwd)/ci_data/config/main_worship.json"
          echo "EASYPREP_DATA_DIR=$(pwd)/ci_data" >> "$GITHUB_ENV"

      - name: 서버 실행 (백그라운드)
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            ./server_test.exe &
          else
            ./server_test &
          fi
          echo "SERVER_PID=$!" >> $GITHUB_ENV

      - name: 헬스체크 대기 (200 또는 503 허용)
        shell: bash
        run: |
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/health 2>/dev/null || echo "000")
            if [[ "$STATUS" == "200" || "$STATUS" == "503" ]]; then
              echo "Server is up (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — waiting..."
            sleep 2
          done
          echo "Server startup timeout"
          exit 1

      - name: API 통합 테스트
        run: go test -tags dev ./internal/handlers/ -run TestIntegration -v

      - name: 서버 종료
        if: always()
        shell: bash
        run: |
          if [[ -n "${SERVER_PID}" ]]; then
            kill "${SERVER_PID}" 2>/dev/null || true
          fi
