name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: go vet
        run: go vet -tags dev ./cmd/server/

      - name: go build check
        run: go build -tags dev -o /dev/null ./cmd/server/

      - name: go smoke tests (with race detector)
        run: go test -race -tags dev ./internal/handlers/ -run TestSmoke -v

  integration:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: 서버 빌드
        run: go build -tags dev -o server_test${{ matrix.os == 'windows-latest' && '.exe' || '' }} ./cmd/server/

      - name: 테스트 데이터 디렉토리 생성
        shell: bash
        run: |
          mkdir -p "$(pwd)/ci_data/config" "$(pwd)/ci_data/data"
          echo '[]' > "$(pwd)/ci_data/config/main_worship.json"
          echo "EASYPREP_DATA_DIR=$(pwd)/ci_data" >> "$GITHUB_ENV"

      - name: 서버 실행 (백그라운드)
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            ./server_test.exe &
          else
            ./server_test &
          fi
          echo "SERVER_PID=$!" >> $GITHUB_ENV

      - name: 헬스체크 대기 (200 또는 503 허용)
        shell: bash
        run: |
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/health 2>/dev/null || echo "000")
            if [[ "$STATUS" == "200" || "$STATUS" == "503" ]]; then
              echo "Server is up (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — waiting..."
            sleep 2
          done
          echo "Server startup timeout"
          exit 1

      - name: API 통합 테스트
        run: go test -tags dev ./internal/handlers/ -run TestIntegration -v

      - name: 서버 종료
        if: always()
        shell: bash
        run: |
          if [[ -n "${SERVER_PID}" ]]; then
            kill "${SERVER_PID}" 2>/dev/null || true
          fi
